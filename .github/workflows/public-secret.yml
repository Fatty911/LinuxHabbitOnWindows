name: Public tracked-text secrets (candidate)

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  public-secret:
    if: github.repository == 'Fatty911/LinuxHabbitOnWindows' && github.event.repository.private == false && github.event.repository.visibility == 'public'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      # Same immutable checkout reference as the unchanged Stage A workflow.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Obtain the fixed official scanner with archive and binary verification
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          tools="$(mktemp -d "$RUNNER_TEMP/public-secret-tools.XXXXXX")"
          archive="$tools/release.tar.gz"
          trap 'rm -f "$archive"' EXIT
          curl --disable --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --max-time 60 --max-filesize 16777216 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          printf '%s  %s\n' 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb "$archive" | sha256sum --check --status
          tar --extract --gzip --file "$archive" --directory "$tools" --no-same-owner --no-same-permissions gitleaks
          chmod 700 "$tools/gitleaks"
          printf '%s  %s\n' 88f91962aa2f93ac6ab281d553b9e125f5197bbbce38f9f2437f7299c32e5509 "$tools/gitleaks" | sha256sum --check --status
          printf 'PUBLIC_SECRET_GITLEAKS=%s\n' "$tools/gitleaks" >> "$GITHUB_ENV"
      - name: Test the isolated reviewed synthetic fixtures
        run: python3 -I -B scripts/secret_gate/ci.py fixtures
      - name: Scan the complete supported tracked non-Markdown event snapshot
        run: python3 -I -B scripts/secret_gate/ci.py scan
      - name: Remove the downloaded scanner
        if: always()
        shell: bash
        run: |
          if [[ -n "${PUBLIC_SECRET_GITLEAKS:-}" ]]; then
            case "$PUBLIC_SECRET_GITLEAKS" in
              "$RUNNER_TEMP"/public-secret-tools.*/gitleaks)
                rm -f -- "$PUBLIC_SECRET_GITLEAKS"
                rmdir -- "${PUBLIC_SECRET_GITLEAKS%/*}"
                ;;
              *) exit 1 ;;
            esac
          fi
